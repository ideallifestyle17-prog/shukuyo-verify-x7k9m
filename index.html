<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿曜計算テスト（DBベース）- 本命宿・相性</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .status {
      text-align: center;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: 14px;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
    .status.ready {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 30px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: none;
    }
    .result.show {
      display: block;
    }
    .shuku-name {
      font-size: 48px;
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }
    .shuku-reading {
      text-align: center;
      color: #888;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .detail {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
    }
    .detail p {
      margin: 8px 0;
    }
    .detail strong {
      color: #333;
    }
    .ganshi-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
    .ganshi-item {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .ganshi-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 5px;
    }
    .ganshi-value {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
    
    /* 五行テーブル */
    .gogyo-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    .gogyo-table th,
    .gogyo-table td {
      padding: 10px;
      text-align: center;
      border: 1px solid #eee;
    }
    .gogyo-table th {
      background: #f5f5f5;
      font-size: 12px;
      color: #888;
      font-weight: normal;
    }
    .gogyo-table th.row-header {
      background: #f0f0f0;
      color: #666;
      font-weight: bold;
    }
    .gogyo-table td {
      font-size: 18px;
      font-weight: bold;
    }
    .gogyo-table .gogyo-wood { color: #2e7d32; }
    .gogyo-table .gogyo-fire { color: #c62828; }
    .gogyo-table .gogyo-earth { color: #8d6e63; }
    .gogyo-table .gogyo-metal { color: #757575; }
    .gogyo-table .gogyo-water { color: #1565c0; }
    
    /* 相性セクション */
    .section-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin: 40px 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }
    .person-inputs {
      display: flex;
      gap: 20px;
    }
    .person-input {
      flex: 1;
    }
    .person-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }
    .compatibility-result {
      margin-top: 30px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: none;
    }
    .compatibility-result.show {
      display: block;
    }
    .compat-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .compat-person {
      text-align: center;
    }
    .compat-shuku {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
    .compat-arrow {
      font-size: 24px;
      color: #667eea;
    }
    .compat-type {
      font-size: 36px;
      text-align: center;
      font-weight: bold;
      color: #667eea;
      margin: 20px 0;
    }
    .compat-distance {
      text-align: center;
      font-size: 18px;
      color: #888;
      margin-bottom: 15px;
    }
    .compat-detail {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .compat-role {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
    .compat-role.person1 {
      background: #e3f2fd;
      color: #1565c0;
    }
    .compat-role.person2 {
      background: #fce4ec;
      color: #c2185b;
    }
    .compat-description {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>宿曜計算テスト</h1>
  
  <div class="status loading" id="status">
    データベース読み込み中...
  </div>
  
  <div class="section-title">本命宿を調べる</div>
  
  <div class="form-group">
    <label>生年月日</label>
    <input type="date" id="birthdate" value="1994-02-21" min="1900-01-01" max="2099-12-31">
  </div>
  
  <button onclick="calculate()" id="calcBtn" disabled>本命宿を計算</button>
  
  <div class="result" id="result">
    <div class="shuku-name" id="shukuName"></div>
    <div class="shuku-reading" id="shukuReading"></div>
    <div class="detail">
      <p><strong>旧暦:</strong> <span id="lunarDate"></span></p>
    </div>
  </div>
  
  <!-- 相性セクション -->
  <div class="section-title">相性を調べる</div>
  
  <div class="form-group">
    <div class="person-inputs">
      <div class="person-input">
        <div class="person-label">自分の生年月日</div>
        <input type="date" id="person1Date" value="1994-02-21" min="1900-01-01" max="2099-12-31">
      </div>
      <div class="person-input">
        <div class="person-label">相手の生年月日</div>
        <input type="date" id="person2Date" value="1990-01-01" min="1900-01-01" max="2099-12-31">
      </div>
    </div>
  </div>
  
  <button onclick="calculateCompatibility()" id="compatBtn" disabled>相性を計算</button>
  
  <div class="compatibility-result" id="compatibilityResult">
    <div class="compat-header">
      <div class="compat-person">
        <div class="compat-shuku" id="compatShuku1"></div>
        <div style="font-size: 12px; color: #888;">自分</div>
      </div>
      <div class="compat-arrow">×</div>
      <div class="compat-person">
        <div class="compat-shuku" id="compatShuku2"></div>
        <div style="font-size: 12px; color: #888;">相手</div>
      </div>
    </div>
    <div class="compat-type" id="compatType"></div>
    <div class="compat-distance" id="compatDistance"></div>
    <div class="compat-detail">
      <span class="compat-role person1" id="compatRole1"></span>
      <span class="compat-role person2" id="compatRole2"></span>
    </div>
    <div class="compat-description" id="compatDescription"></div>
  </div>
  
  <!-- 五行セクション -->
  <div class="section-title">五行</div>
  
  <div class="form-group">
    <div class="person-inputs">
      <div class="person-input">
        <div class="person-label">自分の生年月日</div>
        <input type="date" id="gogyo1Date" value="1994-02-21" min="1900-01-01" max="2099-12-31">
      </div>
      <div class="person-input">
        <div class="person-label">相手の生年月日</div>
        <input type="date" id="gogyo2Date" value="1990-01-01" min="1900-01-01" max="2099-12-31">
      </div>
    </div>
  </div>
  
  <button onclick="calculateGogyoCompat()" id="gogyoBtn" disabled>五行相性を計算</button>
  
  <div class="result" id="gogyoResult">
    <!-- 五行テーブル（自分） -->
    <div style="margin-bottom: 20px;">
      <div style="font-weight: bold; margin-bottom: 10px; color: #1565c0;">■ 自分</div>
      <table class="gogyo-table">
        <tr>
          <th></th>
          <th>日柱</th>
          <th>月柱</th>
          <th>年柱</th>
        </tr>
        <tr>
          <th class="row-header">干</th>
          <td id="dayGan1"></td>
          <td id="monthGan1"></td>
          <td id="yearGan1"></td>
        </tr>
        <tr>
          <th class="row-header">支</th>
          <td id="dayShi1"></td>
          <td id="monthShi1"></td>
          <td id="yearShi1"></td>
        </tr>
      </table>
    </div>
    
    <!-- 五行テーブル（相手） -->
    <div style="margin-bottom: 20px;">
      <div style="font-weight: bold; margin-bottom: 10px; color: #c2185b;">■ 相手</div>
      <table class="gogyo-table">
        <tr>
          <th></th>
          <th>日柱</th>
          <th>月柱</th>
          <th>年柱</th>
        </tr>
        <tr>
          <th class="row-header">干</th>
          <td id="dayGan2"></td>
          <td id="monthGan2"></td>
          <td id="yearGan2"></td>
        </tr>
        <tr>
          <th class="row-header">支</th>
          <td id="dayShi2"></td>
          <td id="monthShi2"></td>
          <td id="yearShi2"></td>
        </tr>
      </table>
    </div>
    
    <!-- レーダーチャート -->
    <!-- 五行バランス比較（棒グラフ） -->
    <div style="margin: 20px 0;">
      <div style="font-size: 14px; color: #888; margin-bottom: 10px; text-align: center;">五行バランス比較</div>
      <canvas id="gogyoBarChart" width="350" height="200"></canvas>
    </div>
    
    <!-- 合計レーダーチャート -->
    <div style="text-align: center; margin: 30px 0;">
      <div style="font-size: 14px; color: #888; margin-bottom: 10px;">2人の五行合計</div>
      <canvas id="gogyoChart" width="300" height="300"></canvas>
    </div>
    
    <!-- 相性スコア -->
    <div style="text-align: center;">
      <div style="font-size: 14px; color: #888; margin-bottom: 5px;">五行バランス相性</div>
      <div id="gogyoScore" style="font-size: 48px; font-weight: bold; color: #667eea;"></div>
    </div>
  </div>

  <script>
    // 27宿の読み方
    const SHUKU_READINGS = {
      '昴宿': 'ぼうしゅく',
      '畢宿': 'ひっしゅく',
      '觜宿': 'ししゅく',
      '参宿': 'しんしゅく',
      '井宿': 'せいしゅく',
      '鬼宿': 'きしゅく',
      '柳宿': 'りゅうしゅく',
      '星宿': 'せいしゅく',
      '張宿': 'ちょうしゅく',
      '翼宿': 'よくしゅく',
      '軫宿': 'しんしゅく',
      '角宿': 'かくしゅく',
      '亢宿': 'こうしゅく',
      '氐宿': 'ていしゅく',
      '房宿': 'ぼうしゅく',
      '心宿': 'しんしゅく',
      '尾宿': 'びしゅく',
      '箕宿': 'きしゅく',
      '斗宿': 'としゅく',
      '女宿': 'じょしゅく',
      '虚宿': 'きょしゅく',
      '危宿': 'きしゅく',
      '室宿': 'しつしゅく',
      '壁宿': 'へきしゅく',
      '奎宿': 'けいしゅく',
      '婁宿': 'ろうしゅく',
      '胃宿': 'いしゅく',
    };

    let calendarDB = null;

    // DBを読み込む
    async function loadDatabase() {
      const statusEl = document.getElementById('status');
      const calcBtn = document.getElementById('calcBtn');
      
      try {
        const response = await fetch('./data/calendar-db.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        calendarDB = await response.json();
        
        const recordCount = Object.keys(calendarDB).length;
        statusEl.textContent = `データベース読み込み完了（${recordCount.toLocaleString()}件）`;
        statusEl.className = 'status ready';
        calcBtn.disabled = false;
        document.getElementById('compatBtn').disabled = false;
        document.getElementById('gogyoBtn').disabled = false;
      } catch (e) {
        statusEl.textContent = `エラー: ${e.message}`;
        statusEl.className = 'status error';
        console.error('DB読み込みエラー:', e);
      }
    }

    // 計算実行
    function calculate() {
      if (!calendarDB) {
        alert('データベースが読み込まれていません');
        return;
      }

      const dateStr = document.getElementById('birthdate').value;
      const data = calendarDB[dateStr];

      if (!data) {
        alert(`${dateStr} のデータが見つかりません。\n対応範囲: 1900-01-01 〜 2099-12-31`);
        return;
      }

      // 結果を表示
      document.getElementById('shukuName').textContent = data.s;
      document.getElementById('shukuReading').textContent = SHUKU_READINGS[data.s] || '';
      document.getElementById('lunarDate').textContent = formatLunarDate(data.l);
      
      document.getElementById('result').classList.add('show');
    }
    
    // 干 → 五行
    const GAN_GOGYO = {
      '甲': '木', '乙': '木',
      '丙': '火', '丁': '火',
      '戊': '土', '己': '土',
      '庚': '金', '辛': '金',
      '壬': '水', '癸': '水'
    };
    
    // 支 → 五行
    const SHI_GOGYO = {
      '子': '水', '丑': '土', '寅': '木', '卯': '木',
      '辰': '土', '巳': '火', '午': '火', '未': '土',
      '申': '金', '酉': '金', '戌': '土', '亥': '水'
    };
    
    // 五行 → CSSクラス
    const GOGYO_CLASS = {
      '木': 'gogyo-wood',
      '火': 'gogyo-fire',
      '土': 'gogyo-earth',
      '金': 'gogyo-metal',
      '水': 'gogyo-water'
    };
    
    // 干支を分離して表示（suffix: 1=自分, 2=相手）
    function displayGanShiWithSuffix(type, ganshi, suffix) {
      const gan = ganshi[0];
      const shi = ganshi[1];
      const ganGogyo = GAN_GOGYO[gan];
      const shiGogyo = SHI_GOGYO[shi];
      
      const ganEl = document.getElementById(type + 'Gan' + suffix);
      const shiEl = document.getElementById(type + 'Shi' + suffix);
      
      ganEl.textContent = `${gan}（${ganGogyo}）`;
      ganEl.className = GOGYO_CLASS[ganGogyo];
      
      shiEl.textContent = `${shi}（${shiGogyo}）`;
      shiEl.className = GOGYO_CLASS[shiGogyo];
    }
    
    // 干支から五行カウントを取得
    function countGogyo(data) {
      const count = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
      
      // 年干支
      count[GAN_GOGYO[data.y[0]]]++;
      count[SHI_GOGYO[data.y[1]]]++;
      // 月干支
      count[GAN_GOGYO[data.m[0]]]++;
      count[SHI_GOGYO[data.m[1]]]++;
      // 日干支
      count[GAN_GOGYO[data.d[0]]]++;
      count[SHI_GOGYO[data.d[1]]]++;
      
      return count;
    }
    
    // 五行相性計算
    function calculateGogyoCompat() {
      console.log('calculateGogyoCompat 開始');
      
      if (!calendarDB) {
        alert('データベースが読み込まれていません');
        return;
      }

      const date1 = document.getElementById('gogyo1Date').value;
      const date2 = document.getElementById('gogyo2Date').value;
      
      console.log('日付:', date1, date2);
      
      const data1 = calendarDB[date1];
      const data2 = calendarDB[date2];
      
      console.log('データ:', data1, data2);
      
      if (!data1 || !data2) {
        alert('日付のデータが見つかりません。\n対応範囲: 1900-01-01 〜 2099-12-31');
        return;
      }
      
      // テーブル表示
      displayGanShiWithSuffix('year', data1.y, '1');
      displayGanShiWithSuffix('month', data1.m, '1');
      displayGanShiWithSuffix('day', data1.d, '1');
      displayGanShiWithSuffix('year', data2.y, '2');
      displayGanShiWithSuffix('month', data2.m, '2');
      displayGanShiWithSuffix('day', data2.d, '2');
      
      // 五行カウント
      const count1 = countGogyo(data1);
      const count2 = countGogyo(data2);
      
      // レーダーチャート描画（スコア計算を含む）
      drawGogyoChart(data1, data2, count1, count2);
      
      document.getElementById('gogyoResult').classList.add('show');
    }
    
    // レーダーチャート描画
    function drawGogyoChart(data1, data2, count1, count2) {
      const canvas = document.getElementById('gogyoChart');
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = 120;
      
      // 五行の順序（時計回り、上から）
      const gogyoOrder = ['火', '土', '金', '水', '木'];
      const gogyoColors = {
        '火': '#c62828',
        '土': '#8d6e63',
        '金': '#757575',
        '水': '#1565c0',
        '木': '#2e7d32'
      };
      
      // 合計値
      const total = {};
      gogyoOrder.forEach(g => {
        total[g] = count1[g] + count2[g];
      });
      
      // 最大値（6に固定、それ以上ははみ出す）
      const maxValue = 6;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 背景の正五角形（グリッド）
      for (let level = 1; level <= 6; level++) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const angle = (i * 72 - 90) * Math.PI / 180;
          const r = (maxRadius / 6) * level;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = '#eee';
        ctx.stroke();
      }
      
      // 軸線
      for (let i = 0; i < 5; i++) {
        const angle = (i * 72 - 90) * Math.PI / 180;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + maxRadius * Math.cos(angle), centerY + maxRadius * Math.sin(angle));
        ctx.strokeStyle = '#ddd';
        ctx.stroke();
      }
      
      // ラベル
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < 5; i++) {
        const angle = (i * 72 - 90) * Math.PI / 180;
        const x = centerX + (maxRadius + 20) * Math.cos(angle);
        const y = centerY + (maxRadius + 20) * Math.sin(angle);
        const g = gogyoOrder[i];
        ctx.fillStyle = gogyoColors[g];
        ctx.fillText(g, x, y);
      }
      
      // 2人の合計（レーダーチャート）
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i * 72 - 90) * Math.PI / 180;
        const g = gogyoOrder[i];
        const r = (total[g] / maxValue) * maxRadius;
        const x = centerX + r * Math.cos(angle);
        const y = centerY + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
      ctx.fill();
      ctx.strokeStyle = '#667eea';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // 棒グラフを描画
      drawGogyoBarChart(count1, count2, gogyoOrder, gogyoColors);
      
      // 新しいスコア計算（3項目合計100点）
      const scores = calculateNewGogyoScore(data1, data2, count1, count2);
      
      return scores.total;
    }
    
    // 棒グラフ描画
    function drawGogyoBarChart(count1, count2, gogyoOrder, gogyoColors) {
      const canvas = document.getElementById('gogyoBarChart');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      const barWidth = 20;
      const barGap = 4;
      const groupGap = 20;
      const groupWidth = barWidth * 2 + barGap;
      const totalWidth = groupWidth * 5 + groupGap * 4;
      const startX = (width - totalWidth) / 2;
      const maxBarHeight = 100;
      const maxValue = 4;
      const baseY = height - 25;
      
      gogyoOrder.forEach((g, i) => {
        const x = startX + i * (groupWidth + groupGap);
        
        // 自分の棒（左）
        const h1 = (count1[g] / maxValue) * maxBarHeight;
        ctx.fillStyle = 'rgba(21, 101, 192, 0.7)';
        ctx.fillRect(x, baseY - h1, barWidth, h1);
        
        // 相手の棒（右）
        const h2 = (count2[g] / maxValue) * maxBarHeight;
        ctx.fillStyle = 'rgba(194, 24, 91, 0.7)';
        ctx.fillRect(x + barWidth + barGap, baseY - h2, barWidth, h2);
        
        // ラベル
        ctx.fillStyle = gogyoColors[g];
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(g, x + groupWidth / 2, baseY + 15);
        
        // 数値
        ctx.fillStyle = '#1565c0';
        ctx.font = '10px sans-serif';
        ctx.fillText(count1[g], x + barWidth / 2, baseY - h1 - 5);
        ctx.fillStyle = '#c2185b';
        ctx.fillText(count2[g], x + barWidth + barGap + barWidth / 2, baseY - h2 - 5);
      });
      
      // 凡例
      ctx.fillStyle = 'rgba(21, 101, 192, 0.7)';
      ctx.fillRect(10, 5, 12, 12);
      ctx.fillStyle = '#333';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('自分', 25, 14);
      
      ctx.fillStyle = 'rgba(194, 24, 91, 0.7)';
      ctx.fillRect(55, 5, 12, 12);
      ctx.fillStyle = '#333';
      ctx.fillText('相手', 70, 14);
    }
    
    // 新しい五行相性計算（3項目合計100点）
    function calculateNewGogyoScore(data1, data2, count1, count2) {
      // 五行相性（50点）
      const gogyoScore = calculateGogyoRelationScore(data1, data2, count1, count2);
      
      // 日干相性（30点）
      const niganScore = calculateNiganCompat(data1, data2);
      
      // 不足五行補完（20点）
      const deficiencyScore = calculateDeficiencyCompat(count1, count2);
      
      const total = gogyoScore + niganScore + deficiencyScore;
      
      // 内訳を表示
      document.getElementById('gogyoScore').innerHTML = `
        <div style="font-size: 48px; font-weight: bold; color: #667eea;">${total}点</div>
        <div style="font-size: 12px; color: #888; margin-top: 10px;">
          五行相性: ${gogyoScore}/50点<br>
          日干相性: ${niganScore}/30点<br>
          不足補完: ${deficiencyScore}/20点
        </div>
      `;
      
      return { total, gogyoScore, niganScore, deficiencyScore };
    }
    
    // 五行相性（50点）- 命式全体の五行構成同士を比較
    function calculateGogyoRelationScore(data1, data2, count1, count2) {
      console.log('calculateGogyoRelationScore:', count1, count2);
      
      const gogyoList = ['木', '火', '土', '金', '水'];
      
      // 相生関係
      const sosei = {
        '木': '火',
        '火': '土',
        '土': '金',
        '金': '水',
        '水': '木'
      };
      
      // 相剋関係
      const sokoku = {
        '木': '土',
        '土': '水',
        '水': '火',
        '火': '金',
        '金': '木'
      };
      
      let rawScore = 0;
      
      // 各五行ペアを比較
      gogyoList.forEach(g1 => {
        gogyoList.forEach(g2 => {
          const c1 = count1[g1];
          const c2 = count2[g2];
          
          if (c1 === 0 || c2 === 0) return;
          
          // 同じ五行
          if (g1 === g2) {
            // 過剰にならないよう、min(c1, c2)で調整
            rawScore += Math.min(c1, c2) * 1;
          }
          // 相生（g1→g2 または g2→g1）
          else if (sosei[g1] === g2 || sosei[g2] === g1) {
            // 過剰にならないよう、sqrt(c1 * c2)で調整
            rawScore += Math.sqrt(c1 * c2) * 1;
          }
          // 相剋（g1→g2 または g2→g1）
          else if (sokoku[g1] === g2 || sokoku[g2] === g1) {
            rawScore -= Math.sqrt(c1 * c2) * 2;
          }
          // 無関係は0
        });
      });
      
      console.log('五行相性 rawScore:', rawScore);
      
      // 正規化（平均25〜35点になるよう調整）
      // rawScoreの範囲は概ね-20〜+20程度
      // 25 + rawScore * 1.25 で 0〜50に収める
      const normalizedScore = Math.round(25 + rawScore * 1.25);
      
      return Math.min(50, Math.max(0, normalizedScore));
    }
    
    // 日干相性（30点）
    function calculateNiganCompat(data1, data2) {
      const nigan1 = GAN_GOGYO[data1.d[0]];
      const nigan2 = GAN_GOGYO[data2.d[0]];
      
      if (nigan1 === nigan2) return 25; // 同じ五行
      
      // 相生
      const sosei = {
        '木': '火',
        '火': '土',
        '土': '金',
        '金': '水',
        '水': '木'
      };
      if (sosei[nigan1] === nigan2 || sosei[nigan2] === nigan1) return 30;
      
      // 相剋
      const sokoku = {
        '木': '土',
        '土': '水',
        '水': '火',
        '火': '金',
        '金': '木'
      };
      if (sokoku[nigan1] === nigan2 || sokoku[nigan2] === nigan1) return 5;
      
      return 15; // 無関係
    }
    
    // 不足五行補完（20点）- 自分の不足を相手が補えるか
    function calculateDeficiencyCompat(count1, count2) {
      // 自分の最も少ない五行を「不足五行」とする
      const gogyoList = ['木', '火', '土', '金', '水'];
      let minGogyo = gogyoList[0];
      let minCount = count1[minGogyo];
      
      gogyoList.forEach(g => {
        if (count1[g] < minCount) {
          minCount = count1[g];
          minGogyo = g;
        }
      });
      
      console.log('自分の不足五行:', minGogyo, '(', minCount, ')');
      
      // 相手がその五行を持つか
      const partnerHas = count2[minGogyo];
      console.log('相手の所持数:', partnerHas);
      
      if (partnerHas >= 2) return 20;
      if (partnerHas === 1) return 10;
      return 0;
    }

    // ========== 相性計算 ==========
    
    // 27宿の配列（宿曜盤の順序：反時計回り）
    const SHUKU_ORDER = [
      '昴宿', '畢宿', '觜宿', '参宿', '井宿', '鬼宿', '柳宿', '星宿', '張宿',
      '翼宿', '軫宿', '角宿', '亢宿', '氐宿', '房宿', '心宿', '尾宿', '箕宿',
      '斗宿', '女宿', '虚宿', '危宿', '室宿', '壁宿', '奎宿', '婁宿', '胃宿'
    ];
    
    // 三九の秘法：自分の宿を0として、相手の宿との距離から関係を判定
    // 距離 → [関係タイプ, 自分の立場, 相手の立場, 距離区分]
    const HIHO_MAP = {
      0:  ['命', '命', '命', null],
      1:  ['栄親', '栄', '親', '近距離'],
      2:  ['友衰', '衰', '友', '近距離'],
      3:  ['安壊', '安', '壊', '近距離'],
      4:  ['危成', '危', '成', '近距離'],
      5:  ['危成', '成', '危', '近距離'],
      6:  ['安壊', '壊', '安', '近距離'],
      7:  ['友衰', '友', '衰', '近距離'],
      8:  ['栄親', '親', '栄', '近距離'],
      9:  ['業胎', '業', '胎', null],
      10: ['栄親', '栄', '親', '中距離'],
      11: ['友衰', '衰', '友', '中距離'],
      12: ['安壊', '安', '壊', '中距離'],
      13: ['危成', '危', '成', '中距離'],
      14: ['危成', '成', '危', '中距離'],
      15: ['安壊', '壊', '安', '中距離'],
      16: ['友衰', '友', '衰', '中距離'],
      17: ['栄親', '親', '栄', '中距離'],
      18: ['業胎', '胎', '業', null],
      19: ['栄親', '栄', '親', '遠距離'],
      20: ['友衰', '衰', '友', '遠距離'],
      21: ['安壊', '安', '壊', '遠距離'],
      22: ['危成', '危', '成', '遠距離'],
      23: ['危成', '成', '危', '遠距離'],
      24: ['安壊', '壊', '安', '遠距離'],
      25: ['友衰', '友', '衰', '遠距離'],
      26: ['栄親', '親', '栄', '遠距離'],
    };
    
    // 相性タイプの説明
    const COMPAT_DESCRIPTIONS = {
      '命': '同じ宿同士の特別な縁。深い理解と強い絆で結ばれますが、似すぎているがゆえの衝突も。',
      '業胎': '前世と来世で繋がる因縁の関係。業は過去からの縁、胎は未来への縁を示します。',
      '栄親': '互いに高め合える最良の相性。栄は相手から繁栄をもたらされ、親は相手に親しみを感じます。',
      '友衰': '友人として良好な関係。友は相手を助け、衰は相手から助けられる関係です。',
      '安壊': '波乱に富んだ関係。安は相手に安らぎを感じ、壊は相手に振り回されることも。',
      '危成': '刺激的な関係。危は相手に危機感を、成は相手に達成感をもたらします。',
    };
    
    // 相性を計算
    function calculateCompatibility() {
      if (!calendarDB) {
        alert('データベースが読み込まれていません');
        return;
      }
      
      const date1 = document.getElementById('person1Date').value;
      const date2 = document.getElementById('person2Date').value;
      
      const data1 = calendarDB[date1];
      const data2 = calendarDB[date2];
      
      if (!data1 || !data2) {
        alert('日付のデータが見つかりません。\n対応範囲: 1900-01-01 〜 2099-12-31');
        return;
      }
      
      const shuku1 = data1.s;
      const shuku2 = data2.s;
      
      // 宿のインデックスを取得
      const idx1 = SHUKU_ORDER.indexOf(shuku1);
      const idx2 = SHUKU_ORDER.indexOf(shuku2);
      
      // 距離を計算（person1から見たperson2の位置）
      let distance = (idx2 - idx1 + 27) % 27;
      
      const hiho = HIHO_MAP[distance];
      const [type, role1, role2, distanceLabel] = hiho;
      
      // 結果を表示
      document.getElementById('compatShuku1').textContent = shuku1;
      document.getElementById('compatShuku2').textContent = shuku2;
      document.getElementById('compatType').textContent = type;
      document.getElementById('compatDistance').textContent = distanceLabel ? `（${distanceLabel}）` : '';
      document.getElementById('compatRole1').textContent = `自分：${role1}`;
      document.getElementById('compatRole2').textContent = `相手：${role2}`;
      document.getElementById('compatDescription').textContent = COMPAT_DESCRIPTIONS[type];
      
      document.getElementById('compatibilityResult').classList.add('show');
    }
    
    // 初期化
    loadDatabase();
  </script>
